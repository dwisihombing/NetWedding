name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */4 * *' # Otomatis jalan tiap 4 hari sekali
  workflow_dispatch: # Tombol untuk coba manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Data Ringan dari Supabase
        run: |
          # Perbaikan: Memanggil tabel spesifik agar tercatat sebagai "aktivitas database".
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/users?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
